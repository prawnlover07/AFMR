plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'dev.animal.afmr'
base { archivesName = 'animals-final-music-replacer-neoforge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
configurations { codecSpis { transitive=false } }
apply from: 'gradle/codec-spis.gradle'
neoForge {
    enable { version='21.1.265';disableRecompilation=true }
    runs { client { client() } }
    mods { afmr { sourceSet(sourceSets.main) } }
}
dependencies {
    implementation 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    codecSpis 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    implementation 'com.googlecode.soundlibs:vorbisspi:1.0.3.3'
    codecSpis 'com.googlecode.soundlibs:vorbisspi:1.0.3.3'
    implementation jarJar('com.googlecode.soundlibs:jlayer:1.0.1.4')
    implementation jarJar('com.googlecode.soundlibs:tritonus-share:0.3.7.4')
    implementation jarJar('org.jflac:jflac-codec:1.5.2')
    implementation jarJar('net.jthink:jaudiotagger:3.0.1')
    ['imageio-webp','imageio-core','imageio-metadata'].each {
        implementation jarJar("com.twelvemonkeys.imageio:${it}:3.15.3")
    }
    ['common-lang','common-io','common-image'].each {
        implementation jarJar("com.twelvemonkeys.common:${it}:3.15.3")
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.13.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
ext.uiCopyRoot = file('docs/UI-COPY.md').isFile()?projectDir:file('../..')
ext.uiCopyTarget = 'legacy'
apply from: new File(uiCopyRoot,'gradle/ui-copy.gradle')
processResources { from('LICENSE', 'THIRD_PARTY.md', 'THIRD_PARTY_NOTICES.txt', 'TEMPLATE_LICENSE.txt', 'TWELVEMONKEYS_LICENSE.txt', 'LGPL-2.0.txt', 'LGPL-2.1.txt') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('sourceZip', Zip) {
    archiveFileName = "animals-final-music-replacer-neoforge-1.21.1-${project.version}-source.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(projectDir) { exclude '.gradle/**', 'build/**', 'run*/**', '**/logs/**', '**/*.log', '**/*.afmrb', '**/restore-previous/**' }
    if (uiCopyRoot != projectDir) {
        from(new File(uiCopyRoot, 'docs/UI-COPY.md')) { into 'docs' }
        from(new File(uiCopyRoot, 'gradle/ui-copy.gradle')) { into 'gradle' }
        from(new File(uiCopyRoot, 'copy/utility-en_us.json')) { into 'copy' }
    }
}


// Minimal optional dedicated-server distribution; no client/audio dependencies.
tasks.register('serverJar', Jar) {
    archiveBaseName = 'animals-final-music-replacer-server-neoforge-1.21.1'
    from(sourceSets.main.output) {
        include 'dev/animal/afmr/server/**', 'dev/animal/afmr/network/**', 'dev/animal/afmr/core/StructureContext*'
    }
    from('src/server/resources')
    from('LICENSE')
}
tasks.named('assemble') { dependsOn tasks.named('serverJar') }

// Protocol component tests need Minecraft/Netty; keep pure regression tests independent.
sourceSets {
    networkTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    networkTestImplementation.extendsFrom testImplementation
    networkTestRuntimeOnly.extendsFrom testRuntimeOnly
}
tasks.register('networkTest', Test) {
    testClassesDirs = sourceSets.networkTest.output.classesDirs
    classpath = sourceSets.networkTest.runtimeClasspath
    useJUnitPlatform()
}
tasks.named('check') { dependsOn tasks.named('networkTest') }

compileTestJava { javaCompiler=javaToolchains.compilerFor {languageVersion=JavaLanguageVersion.of(25)};options.release=25 }
tasks.withType(Test).configureEach {javaLauncher=javaToolchains.launcherFor {languageVersion=JavaLanguageVersion.of(25)}}
sourceSets.test.compileClasspath+=sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath+=sourceSets.main.runtimeClasspath

if(project.hasProperty('probe')) {
 def clientProbeDir=project.hasProperty('integration')?(project.findProperty('integrationDir')?:'run-integration'):'run-probe'
 sourceSets { probe { compileClasspath+=sourceSets.main.output+sourceSets.main.compileClasspath;runtimeClasspath+=(sourceSets.main.runtimeClasspath-sourceSets.main.output).filter { !(it.name ==~ /(?:mp3spi|vorbisspi|jlayer|jorbis|tritonus-share|jflac-codec|jaudiotagger|imageio-webp|imageio-core|imageio-metadata|common-lang|common-io|common-image)-.*/) } } }
 neoForge { addModdingDependenciesTo sourceSets.probe;mods {afmr_probe {sourceSet sourceSets.probe}};runs {client {
  sourceSet=sourceSets.probe;loadedMods=[mods.afmr_probe];gameDirectory=file(clientProbeDir);programArguments.addAll('--username','AFMRNeoPort');if(!project.hasProperty('integration')&&!project.hasProperty('companion'))programArguments.addAll('--quickPlaySingleplayer','AFMR Smoke');systemProperty 'afmr.smoke.uiFollowup','true'
  if(project.hasProperty('integration')){systemProperty 'afmr.smoke.uiFollowup','false';systemProperty 'afmr.probe.integration','true';if(project.hasProperty('restart'))systemProperty 'afmr.probe.restart','true';programArguments.addAll('--quickPlaySingleplayer','AFMR Smoke')}
  if(project.hasProperty('nowPlayingKey'))systemProperty 'afmr.smoke.nowPlayingKey','true'
  if(project.hasProperty('navigation'))systemProperty 'afmr.smoke.navigation','true'
  if(project.hasProperty('muteWarning'))systemProperty 'afmr.smoke.muteWarning','true'
  if(project.hasProperty('codecs'))systemProperty 'afmr.smoke.packagedCodecs','true'
  if(project.hasProperty('companion')){systemProperty 'afmr.smoke.uiFollowup','false';systemProperty 'afmr.smoke.serverCompanion','true';if(project.hasProperty('noCompanion'))systemProperty 'afmr.smoke.noCompanion','true';programArguments.addAll('--quickPlayMultiplayer','127.0.0.1:25589')}
 }}}
 tasks.register('installProbeJar',Copy) {dependsOn tasks.named('jar');from tasks.named('jar',Jar).flatMap {it.archiveFile};into new File(clientProbeDir,'mods')}
 tasks.register('capProbeFps') { doLast {
  def options=file(new File(clientProbeDir,'options.txt'));def lines=options.isFile()?options.readLines():[];lines=lines.findAll { !it.startsWith('maxFps:')&&!it.startsWith('enableVsync:')&&!it.startsWith('onboardAccessibility:') };lines+=['maxFps:60','enableVsync:false','onboardAccessibility:false'];options.parentFile.mkdirs();options.text=lines.join('\n')+'\n'
  def fml=file(new File(clientProbeDir,'config/fml.toml'));def config=fml.isFile()?fml.readLines():[];config=config.findAll { !it.startsWith('earlyWindowControl') };config+='earlyWindowControl = false';fml.parentFile.mkdirs();fml.text=config.join('\n')+'\n'
 } }
 tasks.named('runClient') {dependsOn tasks.named('probeClasses'),tasks.named('installProbeJar'),tasks.named('capProbeFps')}
}

if(project.hasProperty('serverProbe')) {
 sourceSets {serverProbe {compileClasspath+=sourceSets.main.output}}
 neoForge {addModdingDependenciesTo sourceSets.serverProbe;mods {afmr_server_probe {sourceSet sourceSets.serverProbe}};runs {server {
  server();sourceSet=sourceSets.serverProbe;loadedMods=[mods.afmr_server_probe];gameDirectory=file('run-server-probe');programArguments.add('--nogui')
  if(project.hasProperty('socket'))systemProperty 'afmr.probe.socket','true'
 }}}
 tasks.register('prepareServerProbe') {dependsOn tasks.named('serverJar');doLast {
  file('run-server-probe').mkdirs();file('run-server-probe/eula.txt').text='eula=true\n'
  file('run-server-probe/server.properties').text='server-ip=127.0.0.1\nserver-port='+(project.hasProperty('socket')?'25589':'0')+'\nonline-mode=false\nwhite-list=false\npause-when-empty-seconds=-1\nlevel-name=probe-world\nlevel-type=minecraft:flat\ngenerate-structures=false\nspawn-protection=0\nview-distance=2\nsimulation-distance=2\nmax-tick-time=60000\n'
  copy {from tasks.named('serverJar',Jar).get().archiveFile;into 'run-server-probe/mods'}
 }}
 tasks.named('runServer') {dependsOn tasks.named('serverProbeClasses'),tasks.named('prepareServerProbe')}
}
