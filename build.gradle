plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'dev.animal.afmr'
base { archivesName = 'animals-final-music-replacer' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
repositories { mavenCentral() }
neoForge {
    version = project.neo_version
    runs { client { client() } }
    mods { afmr { sourceSet(sourceSets.main) } }
}
dependencies {
    implementation jarJar('com.googlecode.soundlibs:mp3spi:1.9.5.4')
    implementation jarJar('com.googlecode.soundlibs:vorbisspi:1.0.3.3')
    implementation jarJar('com.googlecode.soundlibs:jlayer:1.0.1.4')
    implementation jarJar('com.googlecode.soundlibs:jorbis:0.0.17.4')
    implementation jarJar('com.googlecode.soundlibs:tritonus-share:0.3.7.4')
    implementation jarJar('org.jflac:jflac-codec:1.5.2')
    implementation jarJar('net.jthink:jaudiotagger:3.0.1')
    ['imageio-webp','imageio-core','imageio-metadata'].each {
        implementation jarJar("com.twelvemonkeys.imageio:${it}:3.15.3")
    }
    ['common-lang','common-io','common-image'].each {
        implementation jarJar("com.twelvemonkeys.common:${it}:3.15.3")
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.13.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
ext.uiCopyRoot = projectDir
ext.uiCopyTarget = 'neoforge'
apply from: 'gradle/ui-copy.gradle'
processResources { from('LICENSE', 'THIRD_PARTY.md', 'THIRD_PARTY_NOTICES.txt', 'TEMPLATE_LICENSE.txt', 'TWELVEMONKEYS_LICENSE.txt', 'LGPL-2.0.txt', 'LGPL-2.1.txt') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('sourceZip', Zip) {
    archiveFileName = "animals-final-music-replacer-${project.version}-source.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(projectDir) {
        exclude '.git/**', '.codex/**', 'work/**', 'outputs/**', '*.zip', '**/*.afmrb', '**/restore-previous/**'
        exclude '**/build/**', '**/.gradle/**', '**/run/**', '**/__pycache__/**', '**/*.pyc', '**/logs/**', '**/*.log'
        exclude 'ports/fabric-1.20.1/run*/**', 'ports/fabric-1.20.1/*.log'
        exclude 'testing/native/fixtures/**', 'testing/native/results/**', 'testing/native/scan-fixtures/**'
    }
}

// Minimal optional dedicated-server distribution; no client/audio dependencies.
tasks.register('serverJar', Jar) {
    archiveBaseName = 'animals-final-music-replacer-server-neoforge-26.3'
    from(sourceSets.main.output) {
        include 'dev/animal/afmr/server/**', 'dev/animal/afmr/network/**', 'dev/animal/afmr/core/StructureContext*'
    }
    from('src/server/resources')
    from('LICENSE')
}
tasks.named('assemble') { dependsOn tasks.named('serverJar') }

// Protocol component tests need Minecraft/Netty; keep pure regression tests independent.
sourceSets {
    networkTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    networkTestImplementation.extendsFrom testImplementation
    networkTestRuntimeOnly.extendsFrom testRuntimeOnly
}
tasks.register('networkTest', Test) {
    testClassesDirs = sourceSets.networkTest.output.classesDirs
    classpath = sourceSets.networkTest.runtimeClasspath
    useJUnitPlatform()
}
tasks.named('check') { dependsOn tasks.named('networkTest') }
