plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }

def afmrProperties = new Properties()
file('../../gradle.properties').withInputStream { afmrProperties.load(it) }
def afmrVersion = afmrProperties.getProperty('mod_version')

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neoForge {
    version = afmrProperties.getProperty('neo_version')
    runs {
        client {
            client()
            if (project.hasProperty('keysOnly')) jvmArguments.add('-Dafmr.probe.keysOnly=true')
            if (project.hasProperty('autoExit')) jvmArguments.add('-Dafmr.probe.autoExit=true')
            if (project.hasProperty('skipScan')) jvmArguments.add('-Dafmr.probe.skipScan=true')
            if (project.hasProperty('fresh')) {
                jvmArguments.addAll '-Dafmr.probe.integration=true', '-Dafmr.probe.fresh=true'
                gameDirectory = project.file('run/fresh')
                programArguments.addAll '--username', 'AFMRFresh', '--quickPlaySingleplayer', 'New World'
            } else if (project.hasProperty('performance')) {
                jvmArguments.add('-Dafmr.probe.performance=true')
                gameDirectory = project.file('run/performance')
                programArguments.addAll '--username', 'AFMRPerformance', '--quickPlaySingleplayer', 'New World'
            } else if (project.hasProperty('integration')) {
                jvmArguments.add('-Dafmr.probe.integration=true')
                if (project.hasProperty('restart')) jvmArguments.add('-Dafmr.probe.restart=true')
                if (project.hasProperty('interactive')) jvmArguments.add('-Dafmr.probe.interactive=true')
                gameDirectory = project.file('run/integration')
                programArguments.addAll '--username', 'AFMRIntegration', '--quickPlaySingleplayer', 'New World'
            } else if (project.hasProperty('workspace')) {
                if (project.hasProperty('finalReview')) jvmArguments.add('-Dafmr.probe.finalReview=true')
                if (project.hasProperty('reviewRestart')) jvmArguments.add('-Dafmr.probe.reviewRestart=true')
                if (project.hasProperty('menuColors')) jvmArguments.add('-Dafmr.probe.menuColors=true')
                if (project.hasProperty('colorPickers')) jvmArguments.addAll '-Dafmr.probe.menuColors=true', '-Dafmr.probe.colorPickers=true'
                if (project.hasProperty('menuSeams')) jvmArguments.addAll '-Dafmr.probe.menuColors=true', '-Dafmr.probe.menuSeams=true'
                if (project.hasProperty('playOnJoin')) jvmArguments.add('-Dafmr.probe.playOnJoin=true')
                if (project.hasProperty('backgroundImages')) jvmArguments.add('-Dafmr.probe.backgroundImages=true')
                if (project.hasProperty('playlistSilence')) jvmArguments.add('-Dafmr.probe.playlistSilence=true')
                if (project.hasProperty('widgetSettings')) jvmArguments.add('-Dafmr.probe.widgetSettings=true')
                if (project.hasProperty('configBackup')) jvmArguments.add('-Dafmr.probe.configBackup=true')
                if (project.hasProperty('backupRestart')) jvmArguments.add('-Dafmr.probe.backupRestart=true')
                if (project.hasProperty('backupFromFabric')) jvmArguments.add('-Dafmr.probe.backupFromFabric=true')
                jvmArguments.add('-Dafmr.probe.workspace=true')
                gameDirectory = project.file('run/workspace')
                programArguments.addAll '--username', 'AFMRWorkspace', '--quickPlaySingleplayer', 'New World'
            } else if (project.hasProperty('multiplayer')) {
                jvmArguments.add('-Dafmr.probe.multiplayer=true')
                gameDirectory = project.file('run/multiplayer')
                programArguments.addAll '--username', 'AFMRProbe', '--quickPlayMultiplayer', '127.0.0.1:25575'
            } else {
                gameDirectory = project.file('run')
                programArguments.addAll '--quickPlaySingleplayer', 'New World'
            }
        }
    }
    mods { afmrprobe { sourceSet(sourceSets.main) } }
}
dependencies { compileOnly files("../../build/libs/animals-final-music-replacer-${afmrVersion}.jar") }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('unpackBackgroundProbeLibraries', Sync) {
    from(zipTree(file("../../build/libs/animals-final-music-replacer-${afmrVersion}.jar"))) { include 'META-INF/jarjar/*.jar' }
    into layout.buildDirectory.dir('background-probe-libraries')
}
tasks.register('menuBackgroundProbe', JavaExec) {
    dependsOn classes, tasks.named('unpackBackgroundProbeLibraries')
    classpath = sourceSets.main.runtimeClasspath + files("../../build/libs/animals-final-music-replacer-${afmrVersion}.jar") + fileTree(layout.buildDirectory.dir('background-probe-libraries')) { include '**/*.jar' }
    mainClass = 'dev.animal.afmr.probe.MenuBackgroundProbe'
    jvmArgs '-Djava.awt.headless=true'
}
